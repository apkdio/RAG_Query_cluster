[project]
name = "query-cluster"
version = "0.1.0"
description = "固定阈值的词汇聚类、LLM 初审与复核"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_cluster"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
